# Render's free plan puts the backup class server to sleep after 15 minutes without visitors, and waking it
# takes up to a minute. On school days this knocks every 10 minutes so classes open straight away.
name: Keep the class server awake
on:
  schedule:
    # 05:00-14:50 UTC, Monday to Friday (07:00-16:50 in Romania in winter, 08:00-17:50 in summer)
    - cron: '*/10 5-14 * * 1-5'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://edugames-class.onrender.com/health
