# EduGames class connection server. Deploy: see README.md in this folder.
name = "edugames-class"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Store"]

# Google Sheets (school accounts only). The client secret is a secret: npx wrangler secret put GOOGLE_CLIENT_SECRET
[vars]
GOOGLE_CLIENT_ID = "156411591780-5dtmge49o0r1bq0nn9oq5ei5st66dnmi.apps.googleusercontent.com"
GOOGLE_DOMAIN = "spectrum.ro"
